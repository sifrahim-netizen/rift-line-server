# One-click setup for Render.com (free plan). Render reads this file automatically.
services:
  - type: web
    name: riftline-multiplayer
    runtime: node
    plan: free
    buildCommand: "echo 'no build step needed'"
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://k20czc-ty.myshopify.com
      - key: NODE_VERSION
        value: "22"
